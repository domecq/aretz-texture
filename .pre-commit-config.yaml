# Layer 3 of the quality checks (docs/agent-pipeline.md, section 10).
# Project tools run through uv, so their versions come from uv.lock,
# the same ones CI uses.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: dependency direction
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: fast tests
        entry: uv run --frozen pytest -m "not slow" -q
        language: system
        types: [python]
        pass_filenames: false

# Layer 4 of the quality checks (docs/agent-pipeline.md, section 10).
# The "checks" job is the required status check for main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install environment
        run: uv sync --locked

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Dependency direction
        run: uv run lint-imports

      - name: Full tests with coverage
        run: uv run pytest --cov=aretz_texture --cov-report=term-missing
